n<p>Not all resistance means stop.<\/p>\n<p>Not all resistance means push harder.<\/p>\n<p>Learn the difference.<\/p>\n<p><strong>+The Finish Line<\/strong><\/p>\n<p><em>Done beats perfect.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nProjects that are 90% finished but never seem complete.<\/p>\n<p><strong>Try This<\/strong><\/p>\n<p>Ask yourself:<\/p>\n<p><strong>What does “done” actually look like?<\/strong><\/p>\n<p>Write one clear sentence.<\/p>\n<p>Then stop when you reach it.<\/p>\n<p>You can always improve something later.<\/p>\n<p>You can’t improve something that never gets finished.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Perfection keeps you stuck.<\/p>\n<p>Completion moves your life forward.<\/p>\n<p><strong>+The Future You Check<\/strong><\/p>\n<p><em>Act like the person you’re becoming.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nWhen motivation disappears and you’re tempted to quit.<\/p>\n<p><strong>Ask Yourself<\/strong><\/p>\n<p>Who am I becoming?<\/p>\n<p>Then ask:<\/p>\n<p><strong>What would that version of me do right now?<\/strong><\/p>\n<p>Don’t wait to feel like that person.<\/p>\n<p>Act like them first.<\/p>\n<p>Every action is a vote for the identity you’re building.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Confidence doesn’t create action.<\/p>\n<p>Action creates confidence.<\/p>\n<p>Every small choice teaches your brain who you are becoming.<\/p>", "prompts": []}, {"id": "main_97", "title": "I'm Performing or Lost in the Mask", "path": ["The Regulation Tool Kit"], "html": "<p><strong>Authenticity Tools<\/strong><\/p>\n<p>When you don’t feel like yourself, these tools help you reconnect with who you really are instead of the version trying to stay safe.<\/p>\n<p><strong>+The Congruence Check<\/strong><\/p>\n<p><em>Close the gap between who you are and how you show up.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nAfter a conversation where you left feeling like you weren’t fully yourself.<\/p>\n<p><strong>Ask Yourself<\/strong><\/p>\n<p>• What didn’t I say that was true for me?<\/p>\n<p>• Where did I agree when I actually disagreed?<\/p>\n<p>• Was I showing up as my authentic self or my protective self?<\/p>\n<p>Now ask:<\/p>\n<p><strong>What would the real version of me have said or done?<\/strong><\/p>\n<p>Don’t judge yourself.<\/p>\n<p>Just notice the difference.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>The goal isn’t perfection.<\/p>\n<p>It’s bringing your words, actions, and values into alignment.<\/p>\n<p><strong>+The Values Check<\/strong><\/p>\n<p><em>Make sure your life reflects what matters most.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nWhen life feels “off” but you can’t explain why.<\/p>\n<p><strong>Ask Yourself<\/strong><\/p>\n<p>What are my three to five core values?<\/p>\n<p>Now look back over the last few days.<\/p>\n<p>• How did my actions reflect those values?<\/p>\n<p>• Where did I act against them?<\/p>\n<p>• What’s one small change I could make to live more in alignment?<\/p>\n<p>Your values aren’t measured by what you believe.<\/p>\n<p>They’re revealed by what you repeatedly do.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Misalignment isn’t failure.<\/p>\n<p>It’s feedback.<\/p>\n<p><strong>+The Hidden Parts Check<\/strong><\/p>\n<p><em>Reconnect with the parts of yourself you’ve learned to hide.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nFeeling flat, disconnected, or like you’ve lost yourself.<\/p>\n<p><strong>Ask Yourself<\/strong><\/p>\n<p>What part of me have I been hiding?<\/p>\n<p>Maybe it’s…<\/p>\n<p>• My opinions.<\/p>\n<p>• My playfulness.<\/p>\n<p>• My creativity.<\/p>\n<p>• My anger.<\/p>\n<p>• My needs.<\/p>\n<p>• My sensitivity.<\/p>\n<p>Then ask:<\/p>\n<p><strong>What’s one safe way I can let this part of me show up today?<\/strong><\/p>\n<p>You don’t have to reveal everything.<\/p>\n<p>Just allow yourself to be a little more real.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>The energy it takes to hide yourself is the same energy you could use to live.<\/p>\n<p><strong>+The Real Response Exercise<\/strong><\/p>\n<p><em>Practice responding from your authentic self.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nAfter conversations where you realize you said what felt safe instead of what felt true.<\/p>\n<p><strong>Try This<\/strong><\/p>\n<p>Think about a recent interaction.<\/p>\n<p>Ask yourself:<\/p>\n<p>• What did I say?<\/p>\n<p>• What did I actually want to say?<\/p>\n<p>• What was I protecting myself from?<\/p>\n<p>The next time you’re in a similar situation, practice saying the honest version.<\/p>\n<p>Not the harsh version.<\/p>\n<p>Not the filtered version.<\/p>\n<p>The authentic version.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Authenticity isn’t saying everything you think.<\/p>\n<p>It’s making sure the person you’re presenting is genuinely you.<\/p>", "prompts": []}, {"id": "main_98", "title": "I'm Under Pressure or Have Failed", "path": ["The Regulation Tool Kit"], "html": "<p>I love this section because it teaches resilience instead of motivation. I also think these are tools people will return to often, so I made them faster to scan while keeping the depth.<\/p>\n<p><strong>Resilience Tools<\/strong><\/p>\n<p>When life gets hard, the goal isn’t to avoid the pressure.<\/p>\n<p>It’s to keep moving through it.<\/p>\n<p><strong>+The Recovery Reset<\/strong><\/p>\n<p><em>Recover without losing yourself.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nAfter failure, criticism, rejection, setbacks, or moments that leave you questioning yourself.<\/p>\n<p><strong>Try This<\/strong><\/p>\n<ol>\n<li>Acknowledge what happened.<\/li>\n<\/ol>\n<p>Don’t pretend you’re okay.<\/p>\n<p>Let yourself feel the disappointment without judging it.<\/p>\n<ol>\n<li>Regulate your body.<\/li>\n<\/ol>\n<p>Use the Regulation Stack.<\/p>\n<p>Breathe.<\/p>\n<p>Relax your jaw.<\/p>\n<p>Drop your shoulders.<\/p>\n<ol>\n<li>Separate the event from your identity.<\/li>\n<\/ol>\n<p>Ask yourself:<\/p>\n<p>• What happened?<\/p>\n<p>• What can I learn?<\/p>\n<p>• What does this <em>not<\/em> say about who I am?<\/p>\n<ol>\n<li>Take one small step forward.<\/li>\n<\/ol>\n<p>Don’t focus on fixing everything.<\/p>\n<p>Just keep moving.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Failure is an event.<\/p>\n<p>Not an identity.<\/p>\n<p>Recovery is a skill you can strengthen.<\/p>\n<p><strong>+The Pressure Loop<\/strong><\/p>\n<p><em>Keep moving, even when the pressure is high.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nDeadlines, difficult decisions, uncertainty, or moments where waiting feels easier than acting.<\/p>\n<p><strong>Try This<\/strong><\/p>\n<p>Ask yourself:<\/p>\n<p>• What’s creating the pressure?<\/p>\n<p>• What’s one small action I can take right now?<\/p>\n<p>Then do that one thing.<\/p>\n<p>Don’t wait to feel ready.<\/p>\n<p>Action helps your nervous system recognize that you’re capable.<\/p>\n<p>Every step reduces the feeling of helplessness.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Progress creates confidence.<\/p>\n<p>Waiting rarely does.<\/p>\n<p><strong>+The Pressure Reframe<\/strong><\/p>\n<p><em>See growth instead of danger.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nMoments when fear is convincing you not to take action.<\/p>\n<p><strong>Ask Yourself<\/strong><\/p>\n<p>What story is my brain telling me right now?<\/p>\n<p>Then ask:<\/p>\n<p>• Is this outcome actually likely?<\/p>\n<p>• If it happened, could I handle it?<\/p>\n<p>• Am I facing danger, or simply discomfort?<\/p>\n<p>Growth often feels uncomfortable.<\/p>\n<p>That doesn’t mean you’re unsafe.<\/p>\n<p>It usually means you’re expanding.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Discomfort is often the feeling of growing.<\/p>\n<p>Not the signal to stop.<\/p>\n<p><strong>+The Cost of Staying Stuck<\/strong><\/p>\n<p><em>Separate real risk from imagined risk.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nOverthinking, catastrophizing, or feeling paralyzed by a decision.<\/p>\n<p><strong>Ask Yourself<\/strong><\/p>\n<p>What’s the worst thing I’m afraid will happen?<\/p>\n<p>How likely is it?<\/p>\n<p>If it happened…<\/p>\n<p>Could I handle it?<\/p>\n<p>Now ask one more question:<\/p>\n<p><strong>What’s the cost of doing nothing?<\/strong><\/p>\n<p>Sometimes staying where you are carries a bigger risk than taking the first step.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Your brain naturally overestimates risk.<\/p>\n<p>Slow down.<\/p>\n<p>Look at the facts.<\/p>\n<p>Then decide.<\/p>", "prompts": []}, {"id": "main_99", "title": "I'm Depleted and Drifting", "path": ["The Regulation Tool Kit"], "html": "<p><strong>Energy &amp; Rhythm Tools<\/strong><\/p>\n<p>When your energy is low, your routines have fallen apart, or life feels off track, use these tools to rebuild your foundation one step at a time.<\/p>\n<p>+<strong>The Rhythm Reset<\/strong><\/p>\n<p><em>Get back to the habits that keep you grounded.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nAfter travel, illness, burnout, a stressful season, or anytime your routines have fallen apart.<\/p>\n<p><strong>Try This<\/strong><\/p>\n<p>Ask yourself:<\/p>\n<p><strong>What’s the one habit that would help me feel most like myself again?<\/strong><\/p>\n<p>Maybe it’s:<\/p>\n<p>• Going to bed on time.<\/p>\n<p>• Starting your morning intentionally.<\/p>\n<p>• Taking a daily walk.<\/p>\n<p>• Eating regular meals.<\/p>\n<p>Choose one.<\/p>\n<p>Focus only on that habit for the next three days.<\/p>\n<p>Once it feels steady, add another.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>You don’t rebuild your life all at once.<\/p>\n<p>You rebuild it one rhythm at a time.<\/p>\n<p><strong>+The Energy Audit<\/strong><\/p>\n<p><em>Find what’s draining you and what fills you back up.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nFeeling exhausted, unmotivated, or depleted without knowing why.<\/p>\n<p><strong>Ask Yourself<\/strong><\/p>\n<p>Looking back over the last week…<\/p>\n<p>• What consistently gave me energy?<\/p>\n<p>• What consistently drained me?<\/p>\n<p>Now separate the drains into two groups.<\/p>\n<p><strong>Necessary<\/strong><\/p>\n<p>Things that cost energy but are part of life.<\/p>\n<p><strong>Unnecessary<\/strong><\/p>\n<p>Things you could reduce, delegate, or let go of.<\/p>\n<p>Then ask:<\/p>\n<p><strong>What’s one change that would protect my energy this week?<\/strong><\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Energy isn’t just about getting more rest.<\/p>\n<p>It’s about spending your energy where it matters most.<\/p>\n<p><strong>+The Minimum Viable Day<\/strong><\/p>\n<p><em>Keep the streak alive on hard days.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nDays when everything feels overwhelming and your normal routine isn’t realistic.<\/p>\n<p><strong>Try This<\/strong><\/p>\n<p>Choose your three non-negotiables.<\/p>\n<p>Examples:<\/p>\n<p>• One regulation practice.<\/p>\n<p>• One meaningful task.<\/p>\n<p>• One act of self-care.<\/p>\n<p>If those three things get done…<\/p>\n<p>Today counts.<\/p>\n<p>Tomorrow, return to your normal rhythm.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>A hard day doesn’t become a hard week unless you stop showing up.<\/p>\n<p>Small wins keep you moving forward.<\/p>\n<p><strong>+The Depletion Check<\/strong><\/p>\n<p><em>Know when you need rest and when you need action.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nWhen you feel too tired to begin something important.<\/p>\n<p><strong>Ask Yourself<\/strong><\/p>\n<p>Am I physically depleted…<\/p>\n<p>Or am I resisting this particular task?<\/p>\n<p>If you’re running on little sleep, recovering from illness, or mentally exhausted…<\/p>\n<p>Choose recovery.<\/p>\n<p>If everything sounds manageable except this one task…<\/p>\n<p>It’s probably resistance.<\/p>\n<p>Reduce the task to its smallest possible step.<\/p>\n<p>Then begin.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Rest because your body needs it.<\/p>\n<p>Not because your fear convinced you to wait.<\/p>", "prompts": []}, {"id": "main_100", "title": "I Feel Empty or Directionless", "path": ["The Regulation Tool Kit"], "html": "<p><strong>Purpose &amp; Direction Tools<\/strong><\/p>\n<p>When life feels empty, your motivation has faded, or you’ve lost sight of why you’re doing any of this, use these tools to reconnect with what matters most.<\/p>\n<p><strong>+The Contribution Scan<\/strong><\/p>\n<p><em>Notice the difference you’re already making.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nWhen your work feels meaningless or you’re questioning whether anything you do matters.<\/p>\n<p><strong>Ask Yourself<\/strong><\/p>\n<p>Think back over the last week.<\/p>\n<p>Ask yourself:<\/p>\n<p>• Who did I help?<\/p>\n<p>• What problem did I solve?<\/p>\n<p>• What became easier because I showed up?<\/p>\n<p>• What changed because of my actions?<\/p>\n<p>Write down every answer, no matter how small.<\/p>\n<p>Purpose grows when you recognize your impact.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Meaning isn’t something you find.<\/p>\n<p>It’s something you notice.<\/p>\n<p><strong>+The Alignment Check<\/strong><\/p>\n<p><em>Make sure your daily life reflects who you’re becoming.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nWhen you feel busy but disconnected from what actually matters.<\/p>\n<p><strong>Ask Yourself<\/strong><\/p>\n<p>Think about four areas:<\/p>\n<p>• Who am I becoming?<\/p>\n<p>• What are my core values?<\/p>\n<p>• Where am I headed?<\/p>\n<p>• How am I spending my days?<\/p>\n<p>Now ask:<\/p>\n<p><strong>Do my daily actions support the life I’m trying to build?<\/strong><\/p>\n<p>If not…<\/p>\n<p>What’s one small change that would bring them back into alignment?<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Your calendar tells the truth.<\/p>\n<p>Your daily actions reveal your priorities.<\/p>\n<p><strong>+The Direction Check<\/strong><\/p>\n<p><em>Find your next step when life feels unclear.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nFeeling lost, stuck, or unsure where to focus your energy.<\/p>\n<p><strong>Rate These Areas (1-10)<\/strong><\/p>\n<p>• Health<\/p>\n<p>• Relationships<\/p>\n<p>• Work or Purpose<\/p>\n<p>• Personal Growth<\/p>\n<p>• Finances<\/p>\n<p>• Daily Structure<\/p>\n<p>Which area needs your attention most?<\/p>\n<p>Choose one.<\/p>\n<p>Now ask:<\/p>\n<p><strong>What’s one action that would move this area forward today?<\/strong><\/p>\n<p>Don’t try to improve everything.<\/p>\n<p>Start where the biggest shift can happen.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Clarity comes from movement.<\/p>\n<p>Not from waiting.<\/p>\n<p><strong>+The Meaning Log<\/strong><\/p>\n<p><em>Keep evidence that your life makes a difference.<\/em><\/p>\n<p><strong>Best For:<\/strong><br />\nDays when you feel like nothing you’re doing matters.<\/p>\n<p><strong>Try This<\/strong><\/p>\n<p>Create a page in your journal called:<\/p>\n<p><strong>Evidence That My Life Matters<\/strong><\/p>\n<p>Every day, write down one thing.<\/p>\n<p>It might be:<\/p>\n<p>• Someone you helped.<\/p>\n<p>• A problem you solved.<\/p>\n<p>• A kind conversation.<\/p>\n<p>• A task you completed.<\/p>\n<p>• A moment you showed up for yourself.<\/p>\n<p>When purpose feels distant…<\/p>\n<p>Read the list.<\/p>\n<p>Let the evidence remind you.<\/p>\n<p><strong>Remember:<\/strong><\/p>\n<p>Purpose isn’t built by chasing big moments.<\/p>\n<p>It’s built by noticing the small moments that add up to a meaningful life.<\/p>", "prompts": []}]}, {"id": "extras", "title": "Community Highlights", "desc": "Frameworks, webinar recaps and assignments from the community feed.", "lessons": [{"id": "extras_0", "title": "About This Archive", "path": [], "html": "<p>Saved 2026-07-31 from the Finally YOU community feed (72 posts reviewed).<\/p>\n<p>This folder holds the teaching content Coach Chris posted in the community\nfeed that never made it into the classroom: frameworks, mini-lessons,\nwebinar recaps, and assignments. Routine engagement prompts and other\nmembers' personal posts were left out.<\/p>\n<p><strong>About the webinar videos:<\/strong> Webinar Wednesday / Hot Seat Sunday recordings\nare embedded in the original posts and stream from Skool's video host — they\ncan't be saved offline. Posts that have a recording are marked\n<code>[Video in original post]<\/code> with the post link, so you can watch them while\nyour membership is active.<\/p>", "prompts": []}, {"id": "extras_1", "title": "Community Start Here", "path": [], "html": "<p><em>Chris Krcmarik — 2026-06-24 — https://www.skool.com/my-mindset-guide-8998/start-here<\/em><\/p>\n<p>Welcome to Finally YOU 🫶🏼<\/p>\n<p>I'm really glad you're here. If you joined, there's a good chance you're tired of overthinking, masking, repeating the same patterns, and wondering why lasting change feels so hard. You're in the right place.<\/p>\n<p>Finally YOU isn't about becoming someone else. It's about understanding yourself, trusting yourself, and building a life that actually works for your brain.<\/p>\n<h2>Your First Steps<\/h2>\n<p><strong>1. Start the 7 Day Finally YOU Reset<\/strong>\nHead to the Classroom tab and open Day 1. Complete one lesson each day. Each lesson builds on the last, so take your time and let yourself absorb it.<\/p>\n<p><strong>2. Start Using the Nervous System Reset<\/strong>\nInside the 7 Day Reset folder, you'll also find the Nervous System Reset. Use it anytime you feel overwhelmed, anxious, emotionally flooded, or stuck. I encourage you to practice it every day, even on the good days. The more often you regulate your nervous system, the easier it becomes to access the tools you'll learn throughout the program.<\/p>\n<p><strong>3. Send Me a DM<\/strong>\nTell me: What brought you here? What's one pattern you're ready to understand instead of fight? If these next 7 days changed your life, what would be different? There are no right answers. Just be honest.<\/p>\n<p><strong>4. Join the Conversation<\/strong>\nYou're not meant to do this alone. Share your wins, ask questions, celebrate progress, or talk about the hard days.<\/p>\n<h2>What Happens After Day 7?<\/h2>\n<p>On Day 8, you'll unlock the full Finally YOU Method and your Orientation Welcome Call. Just send me a DM when you're ready, and we'll schedule it.<\/p>\n<p>From there, we'll begin rebuilding: your identity, your self trust, your habits, your relationships, your future.<\/p>\n<p>Your only job today: ✔ Open Day 1. ✔ Complete today's lesson. ✔ Practice the Nervous System Reset.<\/p>\n<p>One lesson. One day. One step at a time.<\/p>", "prompts": []}, {"id": "extras_2", "title": "RAIN - The Four-Step Reset", "path": [], "html": "<p><em>Chris Krcmarik — 2026-04-15<\/em><\/p>\n<p>Most of us were never taught what to do when emotions hit. We were taught to push through, calm down, or figure out why we feel the way we feel — none of which actually works when your nervous system is already running the show.<\/p>\n<p>RAIN is a framework that does work. Here's how to use it.<\/p>\n<h2>R — Recognize<\/h2>\n<p>You don't need to know why you're activated. You just need to notice that you are. Tight chest. Racing thoughts. Jaw clenched. Shoulders up. You're already in it before you clocked that it started — that's not a character flaw, that's disrupted interoception, which is extremely common in AuDHD brains. The amygdala fires before the prefrontal cortex has a chance to process what triggered it.<\/p>\n<p>The only job here is naming it. \"This is anxiety.\" \"This is overwhelm.\" \"This is RSD.\" Naming the state activates the prefrontal cortex and creates the first interruption in the cascade. That's it. That's the whole step.<\/p>\n<h2>A — Accept<\/h2>\n<p>This is the step people skip, and it's why one cortisol spike becomes two.<\/p>\n<p>Resisting an emotional state triggers a second stress response on top of the first. Your nervous system reads the resistance as a new threat and amplifies the original reaction. So when you tell yourself \"I don't have time for this\" or \"I need to stop feeling this way,\" you are neurologically making it worse.<\/p>\n<p>Acceptance doesn't mean you agree with the emotion or think it's justified. It means you stop adding activation on top of activation. One spike is manageable. Two compounds into a spiral.<\/p>\n<h2>I — Investigate<\/h2>\n<p>Instead of trying to think your way out of the loop, you get curious. Where is this actually living in your body right now? Chest tight? Shoulders up? Throat constricted? Stomach dropped?<\/p>\n<p>This isn't just a mindfulness exercise. Shifting attention to physical sensation moves processing from the amygdala to the prefrontal cortex and the insula, the brain region responsible for body awareness and emotional regulation. It's a literal neurological shift in which part of the brain is running the show. AuDHD brains struggle here because interoception is already compromised, but even partial body awareness is enough to interrupt the loop. You don't have to feel everything. You just have to find something.<\/p>\n<h2>N — Non-Identification<\/h2>\n<p>This is the step that matters most for RSD specifically.<\/p>\n<p>When rejection dysphoria hits, the spiral doesn't stop at \"that hurt.\" It goes to \"I am unlovable.\" \"I am broken.\" \"This is who I am.\" The emotion stops being something you're experiencing and becomes something you are.<\/p>\n<p>In AuDHD, the vmPFC has reduced connectivity with the amygdala, meaning the brain's ability to contextualize emotional experience is genuinely weaker than in neurotypical brains. Emotions don't just feel intense — they feel permanent and defining. Non-identification is the step that breaks that.<\/p>\n<p>The anxiety is passing through your nervous system. It is not your nervous system. The rejection activated your brain's threat circuitry. It is not evidence of who you are.<\/p>\n<h2>How to use it<\/h2>\n<ul>\n<li>For general anxiety and overthinking: R and A are usually enough. Name it, stop the resistance, and the spiral doesn't compound.<\/li>\n<li>For full emotional flooding: move through all four. The sequence gives your nervous system enough time and input to shift states.<\/li>\n<li>For RSD specifically: do not skip N. That's where RSD gets its grip.<\/li>\n<\/ul>\n<p>You won't do this perfectly when you're in the middle of a flood. That's not the goal. The goal is catching it one step earlier each time until the gap between trigger and spiral is wide enough to actually work with.<\/p>", "prompts": []}, {"id": "extras_3", "title": "Why 'Just Listen to Your Body' Doesn't Work (Interoception)", "path": [], "html": "<p><em>Chris Krcmarik — 2026-03-27<\/em><\/p>\n<p>Interoception is your brain's ability to detect signals from inside your body such as hunger, exhaustion, overstimulation, even emotions before they have a name. In AuDHD brains, the insular cortex processes those signals differently, which means by the time you notice something is wrong, you're already in the thick of it. You missed the signs because your brain was never reliably translating them in the first place. That's neuroscience — rebuilding that internal signal is part of what unmasking actually is.<\/p>\n<p>Reflection: What's one body signal you consistently miss until it's already a problem?<\/p>", "prompts": []}, {"id": "extras_4", "title": "The AuDHD Energy Budget (Webinar)", "path": [], "html": "<p><em>Chris Krcmarik — 2026-07-22 — [Video in original post] https://www.skool.com/my-mindset-guide-8998/web-wed-the-audhd-energy-budget<\/em><\/p>\n<p>Most people have been taught to manage their time. Very few of us were taught to manage our energy. For AuDHD brains, that's often the missing piece.<\/p>\n<p>If you've ever wondered why you can spend hours hyperfocused one day but struggle to send a single email the next, this lesson will help explain why.<\/p>\n<p>Inside this webinar, you'll learn:<\/p>\n<ul>\n<li>Why your brain isn't lazy, broken, or lacking motivation<\/li>\n<li>The hidden energy drains that quietly deplete your capacity, including masking, sensory overload, decision fatigue, and emotional processing<\/li>\n<li>Why executive function is often the first thing to disappear when your brain is overloaded<\/li>\n<li>How to create an \"energy budget\" so you can stop expecting your brain to perform at 100% every day<\/li>\n<li>Simple strategies to protect your energy instead of constantly pushing through exhaustion<\/li>\n<\/ul>\n<h2>Reflection<\/h2>\n<p>As you watch, ask yourself: Where is most of my energy going each day? What drains me that I rarely acknowledge? What helps me recharge?<\/p>\n<p>You don't have to overhaul your life overnight. Sometimes the biggest shift comes from recognizing that your struggles make sense.<\/p>\n<h2>Action Step<\/h2>\n<p>Create two lists:<\/p>\n<p><strong>Energy Withdrawals<\/strong> — everything that consistently leaves you feeling depleted.<\/p>\n<p><strong>Energy Deposits<\/strong> — everything that helps you feel calmer, clearer, or more capable.<\/p>\n<p>Don't judge your answers. Just notice the patterns.<\/p>", "prompts": []}, {"id": "extras_5", "title": "Knowing Isn't the Same as Doing (Webinar)", "path": [], "html": "<p><em>Chris Krcmarik — 2026-07-15 — [Video in original post] https://www.skool.com/my-mindset-guide-8998/webinar-wed-why-knowing-isnt-the-same-as-doing<\/em><\/p>\n<p>This week we discuss the struggle most neurodivergent people face: the fact of knowing what to do but still not being able to do it. We hit on the awareness trap, why AuDHD brains get stuck, and how to shift out of it.<\/p>\n<p>From the announcement post — what the session covers:<\/p>\n<p>If you've read the books, listened to the podcasts, watched the videos, and still find yourself stuck, you're not lazy. Information doesn't automatically become action. Your brain can understand exactly what needs to happen, while your nervous system, executive function, or habits keep pulling you somewhere else.<\/p>\n<ul>\n<li>Why insight alone rarely creates lasting change<\/li>\n<li>What actually bridges the gap between knowing and doing<\/li>\n<li>How to stop waiting until you \"feel ready\"<\/li>\n<li>Simple ways to build momentum, even when your brain fights you<\/li>\n<\/ul>", "prompts": []}, {"id": "extras_6", "title": "Why Socializing Felt Easy Until I Was Empty (Webinar)", "path": [], "html": "<p><em>Chris Krcmarik — 2026-07-29 — [Video in original post] https://www.skool.com/my-mindset-guide-8998/why-socializing-felt-easy-until-i-was-empty<\/em><\/p>\n<p>Why socializing felt easy… until there was nothing left to talk about.<\/p>\n<p>For years, I thought I was naturally social. I could carry conversations at work, on dates, at parties, and with complete strangers. Then I noticed a pattern.<\/p>\n<p>Every conversation had a built in topic. The job. The event. The shared interest. The situation. The moment there wasn't a clear topic, I felt like I had to create one. I became responsible for keeping the conversation alive, filling every silence, and making sure the interaction didn't fall flat.<\/p>\n<p>That wasn't confidence. It was structure.<\/p>\n<p>In the webinar, we talk about why this is so common in AuDHD, how masking can make you look socially confident while leaving you completely drained, and how to shift from performing conversations to actually connecting with people.<\/p>\n<p>Reflection: Have you ever realized you were great at talking about things, but struggled when there wasn't a shared topic?<\/p>", "prompts": []}, {"id": "extras_7", "title": "Shame-Freeze Loop & RSD (Hot Seat)", "path": [], "html": "<p><em>Chris Krcmarik — 2026-04-05 — [Video in original post]<\/em><\/p>\n<p>Today we discussed the shame/freeze loop that is present in AuDHD individuals. How RSD plays into it and how to break out of a physiological response with another physiological intervention.<\/p>\n<p>Also referenced: the Reset Guide (saved in this archive under the 7 Day Mini Reset → Nervous System Reset Guide) for quick reference on tackling day-to-day stressors with proven strategies. Stay present, stay grounded, stay in charge.<\/p>\n<p>Prompt: How do you combat the functional freeze shame loop?<\/p>", "prompts": []}, {"id": "extras_8", "title": "Unmasking Without Burnout (Workshop)", "path": [], "html": "<p><em>Chris Krcmarik — 2026-01-18/19 — [Recording posted in the community feed; notes were added to the classroom \"webinar notes\" at the time]<\/em><\/p>\n<p>This is not a personality overhaul. This is a seasonal reset for your nervous system, your direction, and your self-trust.<\/p>\n<p>What we're covering:<\/p>\n<ul>\n<li>Why unmasking too fast leads to burnout<\/li>\n<li>Why staying masked leads to stagnation<\/li>\n<li>How to move with regulated momentum instead of emotional collapse<\/li>\n<li>The difference between honesty and nervous system overload<\/li>\n<li>How to build direction without abandoning yourself<\/li>\n<li>Tools you can use in the moment to self-regulate<\/li>\n<\/ul>\n<p>Most people are exhausted because they are managing perception, not effort. They are editing themselves. Anticipating reactions. Smoothing edges. Staying \"appropriate\" instead of grounded. That pattern shows up in men and women, neurodivergent and non-neurodivergent, at work, in relationships, in families.<\/p>\n<p>You'll leave with: clear language around masking, why burnout keeps repeating, and simple regulation tools you can use immediately.<\/p>\n<p>This is for anyone who's tired of choosing between being real and being functional — learning how to do both.<\/p>", "prompts": []}, {"id": "extras_9", "title": "The Mask Audit (Workshop)", "path": [], "html": "<p><em>Chris Krcmarik — 2026-01-22<\/em><\/p>\n<p>You already know how to calm your nervous system. Now we look at what you do after you feel safe.<\/p>\n<p>Most of us don't walk around as \"ourselves.\" We walk around as a version that learned how to survive. At work. In dating. With friends. Even alone. This workshop is about spotting those roles in real time.<\/p>\n<p>We'll break down:<\/p>\n<ul>\n<li>The two main \"survival identities\" you slip into under pressure<\/li>\n<li>How to tell when you're choosing from fear instead of self-trust<\/li>\n<li>Why certain situations leave you exhausted instead of energized<\/li>\n<li>The difference between being liked and being aligned<\/li>\n<\/ul>\n<p><strong>Tool: the Mask Map<\/strong> — a personal map you can use during conversations, decisions, and emotional spikes to catch yourself mid-performance and come back to choice.<\/p>\n<p>Come if you feel like: you're respected but not fully known; you keep saying yes when you mean maybe or no; you leave interactions wondering why you feel smaller afterward.<\/p>", "prompts": []}, {"id": "extras_10", "title": "The 3-Input Reset", "path": [], "html": "<p><em>Chris Krcmarik — 2026-01-20<\/em><\/p>\n<p>Most people try to change their life by changing their goals. Neurodivergent minds change faster when they change their inputs.<\/p>\n<p>Today, run this reset once.<\/p>\n<p><strong>Step 1. Content<\/strong> — What did you consume in the last hour? Video, text, conversation, or silence.<\/p>\n<p><strong>Step 2. State<\/strong> — Did it leave you clearer, heavier, or numb?<\/p>\n<p><strong>Step 3. Upgrade<\/strong> — Choose one better input for the next 10 minutes. Walk. Music. Writing. Breathing. One page of something that challenges you.<\/p>\n<p>You don't need motivation. You need better fuel.<\/p>\n<p>This builds awareness, engagement, and self-trust in a single pass.<\/p>", "prompts": []}, {"id": "extras_11", "title": "Two-Minute Breathing Reset", "path": [], "html": "<p><em>Chris Krcmarik — 2026-01-14<\/em><\/p>\n<p>The world feels loud. Safety feels shaky. Your nervous system is tired. This is not weakness. This is overload.<\/p>\n<p>A quick relaxation reset you can use anywhere. Two minutes. No prep.<\/p>\n<ul>\n<li>Sit or stand still. Feet on the floor.<\/li>\n<li>Inhale through your nose for 4 seconds.<\/li>\n<li>Hold for 2 seconds.<\/li>\n<li>Exhale through your mouth for 6 seconds.<\/li>\n<li>Do this 5 times.<\/li>\n<\/ul>\n<p>Now add this part. It matters.<\/p>\n<ul>\n<li>Drop your shoulders on every exhale.<\/li>\n<li>Unclench your jaw.<\/li>\n<li>Let your belly soften.<\/li>\n<\/ul>\n<p><strong>What this does:<\/strong> longer exhales signal safety to your nervous system. Your heart rate drops. Your body exits threat mode.<\/p>\n<p>You do not need to fix the world tonight. You need your system regulated enough to think clearly tomorrow. Save this. Use it before work, before scrolling.<\/p>", "prompts": []}, {"id": "extras_12", "title": "Weekend Nervous System Reset Assignment", "path": [], "html": "<p><em>Chris Krcmarik — 2026-01-10<\/em><\/p>\n<p><strong>Your goal:<\/strong> Lower nervous system load. Let your body clear stress. Build awareness, not discipline theater.<\/p>\n<p><strong>Friday night<\/strong>\n- No alcohol. Zero.\n- Hydrate. One full glass of water before bed.\n- Sleep without scrolling the last 30 minutes.<\/p>\n<p><strong>Saturday<\/strong>\n- Wake up. No rush.\n- Drink water before caffeine.\n- Light movement only. Walk. Stretch. No lifting.\n- Eat simply. Protein, carbs, real food.\n- One check-in journal entry. Answer this only: \"What has my body been asking for that I've been ignoring?\"<\/p>\n<p><strong>Saturday night<\/strong>\n- No alcohol again.\n- Magnesium if you use it.\n- Early sleep.<\/p>\n<p><strong>Sunday<\/strong>\n- Repeat hydration and light movement.\n- No stimulants beyond what's prescribed.\n- Prep for the week. Food, calendar, priorities.\n- Write one sentence: \"This week I protect my energy by ___.\"<\/p>\n<p><strong>Rules:<\/strong> This is not a detox. This is not punishment. This is regulation and data collection.<\/p>\n<p><strong>Why this matters:<\/strong> When your nervous system calms, clarity returns. You do not fix your life in a weekend. You stop leaking energy so the work can actually land.<\/p>", "prompts": []}, {"id": "extras_13", "title": "Self-Awareness Tracking Assignment", "path": [], "html": "<p><em>Chris Krcmarik — 2025-12-12 (reposted through the course)<\/em><\/p>\n<p><strong>Prompt:<\/strong> You grow faster when you stop guessing what your brain is doing and you start observing it. Today you will track what your brain actually does, not what you think it does.<\/p>\n<p><strong>Instructions<\/strong>\n- Pick one challenge you're dealing with right now.\n- Write what you believe the problem is. Keep it to one sentence.\n- Then track yourself for the next few hours. Write down every time your brain avoids, overthinks, shuts down, spirals, or masks.\n- At the end, compare what you thought the problem was with what your behavior showed.\n- Write the real pattern you noticed. Keep it short and honest.\n- Finish with one shift you will try tomorrow based on your pattern.<\/p>\n<p><strong>What you submit:<\/strong> the challenge you chose; what you thought the problem was; what your behavior actually revealed; the one shift you're trying tomorrow.<\/p>\n<p><strong>Why this matters:<\/strong> Tracking gives you data. Data removes shame. Once you see your pattern, you can change it. This is how you build real confidence and start unmasking — one honest observation at a time.<\/p>", "prompts": []}, {"id": "extras_14", "title": "Boundary Reset (Energy Leaks in Relationships)", "path": [], "html": "<p><em>Chris Krcmarik — 2026-02-02<\/em><\/p>\n<p>Most relationship stress isn't about conflict. It's about overextension.<\/p>\n<p>You give when you're tired. You say yes when you mean maybe. You stay quiet when something feels off. Then resentment shows up and pretends it came from nowhere.<\/p>\n<p>The focus is simple: notice where you leak energy.<\/p>\n<p>Look for these signals:<\/p>\n<ul>\n<li>You feel relief when someone cancels.<\/li>\n<li>You rehearse conversations in your head instead of having them.<\/li>\n<li>You feel responsible for other people's emotions.<\/li>\n<li>You say \"it's fine\" when it isn't.<\/li>\n<\/ul>\n<p><strong>BOUNDARY RESET:<\/strong> Pick one moment today where you slow down before responding. You don't owe speed. You owe honesty.<\/p>\n<p><strong>Prompt:<\/strong> The situation I need a cleaner boundary with right now is ______. No explanations. Just the truth.<\/p>\n<div class=\"ansmount\" data-pid=\"extras_14_q1\"><\/div>", "prompts": [{"id": "extras_14_q1", "label": "Prompt: The situation I need a cleaner boundary with right now is ______. No explanations. Just the truth."}]}, {"id": "extras_15", "title": "Unconditional Love (Friday Focus)", "path": [], "html": "<p><em>Chris Krcmarik — 2026-04-24<\/em><\/p>\n<p>Most of us with AuDHD grew up in homes where love had a nervous system attached to it. Someone else's nervous system. Which meant love felt like relief, not safety. The calm after the storm. The repair after the rupture. That's where connection lived.<\/p>\n<p>So we grew up and started choosing people. And kept ending up in the same place. Not because we were broken. Because our brain was just running the only blueprint it had.<\/p>\n<p>Unconditional love — the kind that just stays, without a tension cycle, without you having to manage anyone's state before your own needs are allowed to exist — probably felt suspicious. Maybe it still does.<\/p>\n<p><strong>Reflection:<\/strong> Think about the earliest version of love you were shown. Not what you were told love was. What it actually felt like in your body. Where did you feel it? What had to happen first before it showed up?<\/p>\n<p><strong>Reframe:<\/strong> Calm is not the absence of love. For a lot of us it just wasn't what love felt like growing up. That's a data problem, not a you problem.<\/p>\n<p><strong>Action:<\/strong> This weekend, notice once — just once — when something steady and calm shows up in a relationship and your brain tries to find the catch. You don't have to fix it. Just notice it. That awareness is the beginning of new data.<\/p>", "prompts": []}, {"id": "extras_16", "title": "Encouragement & Weekly Prompts (Collection)", "path": [], "html": "<p>Short recurring posts worth keeping, gathered in one place.<\/p>\n<hr />\n<h2>Unmasking is not linear (2026-04-28)<\/h2>\n<p>You are not doing it wrong because you masked at work today, or said yes when you meant no, or felt like yourself for two hours and then completely lost it by dinner. That awareness you have now — that moment where you caught it happening — that is the work. A year ago you probably didn't even notice. You're further along than the week feels.<\/p>\n<hr />\n<h2>The Star Chart ⭐ (2026-03-26)<\/h2>\n<p>Acknowledge your wins, because who else is going to? Celebrate accomplishments no matter the size: said no to something draining; caught yourself masking and chose differently; finished a section of the workbook; had one honest conversation you would have avoided a month ago; made it through a hard week without losing yourself in it.<\/p>\n<hr />\n<h2>Sit With This (2026-03-24)<\/h2>\n<p>You can't unmask what you can't see. Before you can change anything, you have to catch yourself doing it. Prompt: What's one situation where you notice yourself becoming a different version of you? Who are you performing for, and what are you afraid would happen if you didn't?<\/p>\n<hr />\n<h2>Do the thing anyway (2026-03-30)<\/h2>\n<p>The hard thing does not get easier the longer you wait. The nervous system just gets better at convincing you the timing is wrong. This week, do the thing anyway. Let the discomfort be proof you are moving in the right direction rather than proof you should stop.<\/p>\n<hr />\n<h2>Weekly check-in template (2026-07-20)<\/h2>\n<p><strong>1. How regulated do you feel today, from 1 to 10?<\/strong><\/p>\n<div class=\"ansmount\" data-pid=\"extras_16_q1\"><\/div>\n<p><strong>2. What's one win from last week, even if it feels small?<\/strong><\/p>\n<div class=\"ansmount\" data-pid=\"extras_16_q2\"><\/div>\n<p><strong>3. What's one thing that's been draining your energy lately?<\/strong><\/p>\n<div class=\"ansmount\" data-pid=\"extras_16_q3\"><\/div>\n<p><strong>4. What's one thing you're committing to this week that Future You will appreciate?<\/strong><\/p>\n<div class=\"ansmount\" data-pid=\"extras_16_q4\"><\/div>\n<p><strong>5. What kind of support do you need this week?<\/strong><\/p>\n<div class=\"ansmount\" data-pid=\"extras_16_q5\"><\/div>\n<p>Progress isn't measured by having the perfect week. It's measured by noticing yourself sooner, making one better choice, and getting back on track a little faster each time.<\/p>\n<hr />\n<h2>Friday… Again 😮‍💨 (2026-07-17)<\/h2>\n<p>For a lot of us, especially if you're AuDHD, life becomes a loop. Wake up. Mask. Work. Recover. Repeat. You get so good at surviving that you stop noticing you're alive.<\/p>\n<p>Slowing down isn't about doing less. It's about creating enough space to ask yourself questions you've been too busy, too exhausted, or too overwhelmed to answer: What do I actually want? What parts of me have I been hiding? What would my life look like if I stopped performing and started living?<\/p>\n<p>Disrupt the pattern before another year becomes another decade.<\/p>\n<hr />\n<h2>Weekend correction (2026-01-30)<\/h2>\n<p>Growth doesn't come from big breakthroughs. It comes from small, honest corrections you actually repeat. Pick one pattern you noticed this week. Do the opposite once. Just once. Different response, different result.<\/p>\n<hr />\n<h2>Steadiness check (2026-01-26)<\/h2>\n<p>Run this check: Where am I holding tension in my body right now? What am I avoiding because it feels unsafe to feel? What would it look like to choose steadiness instead of reactivity? Take one real action. Drink water. Step outside. Send a message that actually matters.<\/p>\n<hr />\n<h2>January: conscious shedding (2026-01-07)<\/h2>\n<p>Pay attention to where you feel \"on.\" Where you edit yourself. Where you choose safety over honesty. Do not change it yet. Name it quietly.<\/p>", "prompts": [{"id": "extras_16_q1", "label": "How regulated do you feel today, from 1 to 10?"}, {"id": "extras_16_q2", "label": "What's one win from last week, even if it feels small?"}, {"id": "extras_16_q3", "label": "What's one thing that's been draining your energy lately?"}, {"id": "extras_16_q4", "label": "What's one thing you're committing to this week that Future You will appreciate?"}, {"id": "extras_16_q5", "label": "What kind of support do you need this week?"}]}]}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('fydata').textContent);

/* ---------- storage (localStorage with in-memory fallback) ---------- */
const mem = {};
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); } catch(e){ return (k in mem)? mem[k] : d; } },
  set(k, v){ mem[k]=v; try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
let ANS = store.get('fy_answers', {});
let PROG = store.get('fy_progress', {});
let NOTES = store.get('fy_notes', {});
const saveAns = debounce(()=>store.set('fy_answers', ANS), 400);
const saveNotes = debounce(()=>store.set('fy_notes', NOTES), 400);
function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}}

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const app = $('#app');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function course(cid){return DATA.courses.find(c=>c.id===cid)}
function lessonIndex(cid,lid){return course(cid).lessons.findIndex(l=>l.id===lid)}
function isDone(lid){return !!PROG[lid]}
function courseProgress(c){const n=c.lessons.length;const d=c.lessons.filter(l=>isDone(l.id)).length;return {d,n,pct:n?Math.round(100*d/n):0}}
function nextIncomplete(){
  for(const cid of ['reset','main']){
    const c=course(cid);
    for(const l of c.lessons) if(!isDone(l.id)) return {cid,l};
  }
  return null;
}
/* group lessons by top path segment, preserving order */
function grouped(c){
  const groups=[]; let cur=null;
  for(const l of c.lessons){
    const key=l.path.join(' › ')||'';
    if(!cur||cur.key!==key){cur={key,items:[]};groups.push(cur)}
    cur.items.push(l);
  }
  return groups;
}

/* ---------- speech ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRec=null, activeBtn=null;
function stopRec(){ if(activeRec){ try{activeRec.stop()}catch(e){} activeRec=null;
  if(activeBtn){activeBtn.classList.remove('rec');activeBtn.textContent='🎤';activeBtn=null} } }
function micToggle(btn, ta){
  if(activeRec && activeBtn===btn){ stopRec(); return; }
  stopRec();
  const rec = new SR();
  rec.lang = navigator.language || 'en-US';
  rec.continuous = true; rec.interimResults = true;
  const base = ta.value ? ta.value.replace(/\s+$/,'') + ' ' : '';
  let finalTxt = '';
  rec.onresult = e => {
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) finalTxt += r[0].transcript + ' ';
      else interim += r[0].transcript;
    }
    ta.value = base + finalTxt + interim;
    ta.dispatchEvent(new Event('input'));
  };
  rec.onend = ()=>{ if(activeRec===rec) stopRec(); };
  rec.onerror = ev => { stopRec(); if(ev.error==='not-allowed') toast('Mic permission needed — or use the 🎤 on your keyboard'); };
  try { rec.start(); activeRec=rec; activeBtn=btn; btn.classList.add('rec'); btn.textContent='■'; }
  catch(e){ toast('Dictation unavailable — use the 🎤 on your keyboard'); }
}

/* ---------- views ---------- */
let VIEW = {name:'home'};
function go(v){ stopRec(); VIEW=v; render(); window.scrollTo(0,0); }

function render(){
  renderTabs();
  if(VIEW.name==='home') renderHome();
  else if(VIEW.name==='course') renderCourse(VIEW.cid);
  else if(VIEW.name==='lesson') renderLesson(VIEW.cid, VIEW.lid);
  else if(VIEW.name==='journal') renderJournalTab();
  else if(VIEW.name==='toolkit') renderToolkitTab();
  else if(VIEW.name==='more') renderMore();
}
function renderTabs(){
  const tabs=[['home','🏠','Home'],['journal','📔','Journal'],['toolkit','🧰','Toolkit'],['more','⚙️','More']];
  const active = VIEW.name==='course'||VIEW.name==='lesson' ? 'home' : VIEW.name;
  $('#tabs').innerHTML = tabs.map(([n,ic,lb])=>
    `<button class="${active===n?'act':''}" onclick="go({name:'${n}'})"><span class="ic">${ic}</span>${lb}</button>`).join('');
}

function renderHome(){
  const nxt = nextIncomplete();
  let h = `<h2 class="pagetitle" style="margin-top:18px">Finally You</h2>`;
  if(nxt){
    const c=course(nxt.cid); const p=courseProgress(c);
    h += `<div class="card tappable" onclick="go({name:'lesson',cid:'${nxt.cid}',lid:'${nxt.l.id}'})">
      <p style="color:var(--accent);font-weight:600;font-size:13px">▶ CONTINUE WHERE YOU LEFT OFF</p>
      <h3>${esc(nxt.l.title)}</h3>
      <p>${esc(c.title)}${nxt.l.path.length? ' — '+esc(nxt.l.path.join(' › ')):''}</p></div>`;
  } else {
    h += `<div class="card"><h3>🎉 Program complete</h3><p>Every lesson is marked done. Revisit anything below.</p></div>`;
  }
  for(const c of DATA.courses){
    const p=courseProgress(c);
    h += `<div class="card tappable" onclick="go({name:'course',cid:'${c.id}'})">
      <h3>${esc(c.title)} ${p.d===p.n?'<span class="pill">Complete</span>':''}</h3>
      <p>${esc(c.desc)}</p>
      <p style="margin-top:8px">${p.d} / ${p.n} lessons</p>
      <div class="progressbar"><div style="width:${p.pct}%"></div></div></div>`;
  }
  h += `<p class="hint">Work top to bottom: the 7-Day Reset first, then the main course — one lesson per sitting. The Journal and Toolkit tabs are always there when you need them.</p>`;
  app.innerHTML = h;
}

function renderCourse(cid){
  const c=course(cid);
  let h = topbar(c.title, ()=>`go({name:'home'})`);
  const p=courseProgress(c);
  h += `<div class="progressbar" style="margin:14px 0 4px"><div style="width:${p.pct}%"></div></div>
        <p class="hint">${p.d} of ${p.n} complete</p>`;
  for(const g of grouped(c)){
    if(g.key) h += `<div class="sechead">${esc(g.key)}</div>`;
    for(const l of g.items){
      const done=isDone(l.id);
      h += `<div class="lrow ${done?'comp':''}" onclick="go({name:'lesson',cid:'${cid}',lid:'${l.id}'})">
        <div class="tick">${done?'✓':''}</div><div class="lt">${esc(l.title)}</div>
        ${l.prompts.length?`<div class="pn">✍︎ ${l.prompts.length}</div>`:''}</div>`;
    }
  }
  app.innerHTML = h;
}

function topbar(title, backExpr){
  return `<header class="top"><button class="back" onclick="${backExpr()}">‹ Back</button>
    <h1>${esc(title)}</h1></header>`;
}

function renderLesson(cid, lid){
  const c=course(cid); const idx=lessonIndex(cid,lid); const l=c.lessons[idx];
  let h = topbar(c.title, ()=>`go({name:'course',cid:'${cid}'})`);
  if(l.path.length) h += `<div class="crumb">${esc(l.path.join(' › '))}</div>`;
  h += `<h2 class="pagetitle">${esc(l.title)}</h2>`;
  h += `<div class="lesson-content">${l.html}</div>`;
  h += `<div class="anscard"><label>MY NOTES ON THIS LESSON</label>
        <div class="answrap"><textarea data-note="${l.id}" placeholder="Anything you want to remember…">${esc(NOTES[l.id]||'')}</textarea>
        ${SR?`<button class="micbtn" data-mic>🎤</button>`:''}</div><div class="savestat"></div></div>`;
  const done=isDone(l.id);
  h += `<button class="bigbtn ${done?'done':''}" id="markbtn">${done?'✓ Completed — tap to un-mark':'Mark lesson complete'}</button>`;
  const prev=c.lessons[idx-1], next=c.lessons[idx+1];
  h += `<div class="navrow">
    <button ${prev?'':'disabled'} onclick="go({name:'lesson',cid:'${cid}',lid:'${prev?prev.id:''}'})">‹ Previous</button>
    <button ${next?'':'disabled'} onclick="go({name:'lesson',cid:'${cid}',lid:'${next?next.id:''}'})">Next ›</button></div>`;
  if(SR) h += `<p class="hint">✍︎ Type your answers, or tap 🎤 to dictate (tap ■ to stop). Everything saves on this device automatically.</p>`;
  else h += `<p class="hint">✍︎ Type your answers — or tap the 🎤 on your keyboard to dictate. Everything saves on this device automatically.</p>`;
  app.innerHTML = h;

  /* mount answer boxes */
  const proms = Object.fromEntries(l.prompts.map(p=>[p.id,p]));
  app.querySelectorAll('.ansmount').forEach(m=>{
    const pid=m.dataset.pid; const p=proms[pid]; if(!p) return;
    m.className='anscard';
    m.innerHTML = `<label>YOUR ANSWER</label><div class="answrap">
      <textarea data-ans="${pid}" placeholder="Type here…">${esc(ANS[pid]||'')}</textarea>
      ${SR?`<button class="micbtn" data-mic>🎤</button>`:''}</div><div class="savestat"></div>`;
  });
  /* wire inputs */
  app.querySelectorAll('textarea[data-ans]').forEach(ta=>{
    ta.addEventListener('input', ()=>{ ANS[ta.dataset.ans]=ta.value; saveAns();
      flashSaved(ta); });
  });
  app.querySelectorAll('textarea[data-note]').forEach(ta=>{
    ta.addEventListener('input', ()=>{ NOTES[ta.dataset.note]=ta.value; saveNotes();
      flashSaved(ta); });
  });
  app.querySelectorAll('.micbtn').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.preventDefault();
      micToggle(btn, btn.closest('.answrap').querySelector('textarea')); });
  });
  $('#markbtn').addEventListener('click', ()=>{
    if(isDone(l.id)){ delete PROG[l.id]; } else { PROG[l.id]=Date.now(); }
    store.set('fy_progress', PROG);
    if(isDone(l.id) && next){ toast('Nice. Next: '+next.title); go({name:'lesson',cid,lid:next.id}); }
    else renderLesson(cid, lid);
  });
}
function flashSaved(ta){
  const s=ta.closest('.anscard').querySelector('.savestat');
  if(s){ s.textContent='saved ✓'; clearTimeout(s._h); s._h=setTimeout(()=>s.textContent='',1200); }
}

function renderJournalTab(){
  const c=course('main');
  let h = `<h2 class="pagetitle" style="margin-top:18px">Daily Guided Journal</h2>
    <p class="hint">The journal pages from the course. Prompts are fillable — answers save automatically.</p>`;
  for(const l of c.lessons.filter(l=>l.path[0]==='Daily Guided Journal')){
    const done=isDone(l.id);
    h += `<div class="lrow ${done?'comp':''}" onclick="go({name:'lesson',cid:'main',lid:'${l.id}'})">
      <div class="tick">${done?'✓':''}</div><div class="lt">${esc(l.title)}</div>
      ${l.prompts.length?`<div class="pn">✍︎ ${l.prompts.length}</div>`:''}</div>`;
  }
  app.innerHTML = h;
}
function renderToolkitTab(){
  const c=course('main');
  let h = `<h2 class="pagetitle" style="margin-top:18px">Regulation Tool Kit</h2>
    <p class="hint">Pick what matches this moment.</p>`;
  for(const l of c.lessons.filter(l=>l.path[0]==='The Regulation Tool Kit')){
    h += `<div class="card tappable" onclick="go({name:'lesson',cid:'main',lid:'${l.id}'})"><h3>${esc(l.title)}</h3></div>`;
  }
  h += `<div class="sechead">Quick resets</div>`;
  const extras=course('extras');
  for(const l of extras.lessons.filter(l=>/RAIN|Breathing|3-Input/.test(l.title))){
    h += `<div class="card tappable" onclick="go({name:'lesson',cid:'extras',lid:'${l.id}'})"><h3>${esc(l.title)}</h3></div>`;
  }
  app.innerHTML = h;
}

function renderMore(){
  const na=Object.keys(ANS).filter(k=>ANS[k]&&ANS[k].trim()).length;
  const nn=Object.keys(NOTES).filter(k=>NOTES[k]&&NOTES[k].trim()).length;
  let h = `<h2 class="pagetitle" style="margin-top:18px">More</h2>
  <div class="card"><h3>Your writing</h3><p>${na} saved answers · ${nn} lesson notes</p>
    <button class="bigbtn ghost" onclick="exportMd()">⬇︎ Export everything (Markdown)</button>
    <button class="bigbtn ghost" onclick="exportJson()">⬇︎ Backup file (JSON)</button>
    <label class="bigbtn ghost" style="text-align:center">⬆︎ Restore backup<input type="file" accept=".json" style="display:none" onchange="importJson(this)"></label>
  </div>
  <div class="card"><h3>About</h3><p>Offline archive of the Finally You program, built for personal use.
   Answers and progress live only in this browser on this device — export a backup now and then.
   If you clear Safari website data, in-app answers are cleared too.</p></div>
  <div class="card"><h3>Reset</h3>
    <button class="bigbtn ghost" style="color:#c33" onclick="if(confirm('Clear all progress and answers on this device?')){localStorage.clear();location.reload()}">Clear all data</button></div>`;
  app.innerHTML = h;
}

/* ---------- export / import ---------- */
function lessonById(lid){ for(const c of DATA.courses){ const l=c.lessons.find(x=>x.id===lid); if(l) return {c,l}; } return null; }
function exportMd(){
  let out = '# Finally You — My Answers\n\nExported ' + new Date().toISOString().slice(0,10) + '\n';
  for(const c of DATA.courses){
    let chead=false;
    for(const l of c.lessons){
      const parts=[];
      for(const p of l.prompts){ const v=ANS[p.id]; if(v&&v.trim()) parts.push('**'+p.label+'**\n\n'+v.trim()); }
      const note=NOTES[l.id];
      if(note&&note.trim()) parts.push('**My notes**\n\n'+note.trim());
      if(parts.length){
        if(!chead){ out+='\n\n---\n\n# '+c.title+'\n'; chead=true; }
        out += '\n\n## '+(l.path.length? l.path.join(' › ')+' — ':'')+l.title+'\n\n'+parts.join('\n\n');
      }
    }
  }
  dl(new Blob([out],{type:'text/markdown'}), 'finally-you-answers.md');
}
function exportJson(){
  dl(new Blob([JSON.stringify({answers:ANS,notes:NOTES,progress:PROG})],{type:'application/json'}),
     'finally-you-backup.json');
}
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Exported'); }
function importJson(inp){
  const f=inp.files[0]; if(!f) return;
  f.text().then(t=>{ try{ const j=JSON.parse(t);
    if(j.answers) ANS=Object.assign(ANS,j.answers);
    if(j.notes) NOTES=Object.assign(NOTES,j.notes);
    if(j.progress) PROG=Object.assign(PROG,j.progress);
    store.set('fy_answers',ANS); store.set('fy_notes',NOTES); store.set('fy_progress',PROG);
    toast('Backup restored'); render();
  } catch(e){ toast('Could not read that file'); } });
}

/* ---------- boot ---------- */
window.go = go; window.exportMd=exportMd; window.exportJson=exportJson; window.importJson=importJson;
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
render();
</script>
</body>
</html>
